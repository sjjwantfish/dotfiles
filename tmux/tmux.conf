# ============================================================
# Plugin Manager (tpm)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'gotbletu/fzf-speed'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'fcsonline/tmux-thumbs'


# ============================================================
# Reload Config
# ============================================================
bind -n M-s source ~/.config/tmux/tmux.conf

# ============================================================
# Prefix: Alt+a
# ============================================================
unbind C-b
set -g prefix M-a
bind M-a send-prefix


# ============================================================
# Basic Settings
# ============================================================
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g alternate-screen off
set -sg escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g allow-passthrough on
# set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'
setw -g pane-border-status top


# ============================================================
# Status Bar
# ============================================================
# set -g status-position bottom
set -g status-position top
set -g status-interval 1
set -g status-style "bg=colour235,fg=colour255"
set -g status-left-length 50
set -g status-right-length 100
# Left: empty (session name is on the right)
set -g status-left "#[bg=colour235]  "
# Center: window list (current window highlighted)
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=colour032,fg=colour255,bold] #I:#W "
set -g window-status-separator ""
# Right: date/time and session name
set -g status-right "#[fg=colour244] %Y-%m-%d  %H:%M  #[bg=colour032,fg=colour255,bold] #S "
# Pane border styling
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour032"
# Message styling
set -g message-style "bg=colour032,fg=colour255"
set -g message-command-style "bg=colour032,fg=colour255"

# ============================================================
# Session Management (workspace → session)
# ============================================================
set -g @sessionx-prefix 'off'
set -g @sessionx-bind 'M-o'
bind -n M-e command-prompt -p "Rename session: " "rename-session '%%'"

# ============================================================
# Pane Management (Alt+\ | Alt+-)
# ============================================================
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
bind -n M-z resize-pane -Z
bind -n M-d rotate-window 

# ============================================================
# Pane Navigation (Alt+Arrow / Ctrl+Arrow)
# ============================================================
bind -n C-Left  select-pane -L
bind -n C-Down  select-pane -D
bind -n C-Up    select-pane -U
bind -n C-Right select-pane -R

# ============================================================
# Window Management (Alt+1~9)
# ============================================================
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :0
bind -n M-t new-window
unbind -T root M-r
bind -n M-r command-prompt -I "#W" { rename-window "%%" }


# Explicitly unbind any residual M-f copy-mode binding from old configs
unbind -T root M-f
set -g mode-keys vi

# ============================================================
# Terminal
# ============================================================
set -g default-terminal "xterm-256color"
set -g monitor-activity on
set -g visual-activity off

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'


# fzf-speed fuzzy tmux command palette
set -g @floax-bind "-n M-x"
set -g @floax-bind-menu "-n M-F"
bind -n M-p display-popup -w 80% -h 60% -E "~/.config/tmux/plugins/fzf-speed/fzf-speed"


# # URL view
# run-shell ~/.config/tmux/plugins/tmux-urlview/urlview.tmux
# bind -n M-\; capture-pane -J \; save-buffer /tmp/tmux-url.buffer \; delete-buffer \; split-window -l 10 "urlview /tmp/tmux-url.buffer"


# ============================================================
# tmux-thumbs: pbcopy for system clipboard (macOS)
# ============================================================
set -g @thumbs-command 'echo -n {} | pbcopy && tmux display-message "Copied to clipboard"'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy && tmux display-message "Copied and pasted" && tmux paste-buffer'
set -g @thumbs-osc52 0
# Regex patterns
set -g @thumbs-regexp-1 '(?:[a-zA-Z0-9._-]+/)+[a-zA-Z0-9._-]+'     # file paths
set -g @thumbs-regexp-2 '\b(?:\d{1,3}\.){3}\d{1,3}\b'                # IPv4 addresses
set -g @thumbs-regexp-3 '\b\d{5,}\b'                                   # PIDs (5+ digits)
set -g @thumbs-regexp-4 '\b[a-zA-Z_][a-zA-Z0-9_]{2,}\b'               # identifiers/words
set -g @thumbs-regexp-5 '(?:0x[a-fA-F0-9]+|\b\d+\b)'                   # hex and numbers
set -g @thumbs-regexp-6 '\"[^\"]{3,}\"'                                 # quoted strings
run-shell ~/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.tmux


# Keep copy mode active after copying a mouse selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
